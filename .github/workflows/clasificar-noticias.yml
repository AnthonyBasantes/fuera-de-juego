
name: Clasificar noticias editoriales

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: write

concurrency:
  group: clasificar-noticias
  cancel-in-progress: false

jobs:
  clasificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clasificar noticias
        run: python scripts/clasificar_noticias.py

      - name: Guardar estados en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/estado_noticias.json

          if git diff --cached --quiet; then
            echo "No hay cambios en los estados."
          else
            git commit -m "Actualizar estados editoriales"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
