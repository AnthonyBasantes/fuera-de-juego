
name: Buscar noticias de futbol

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: buscar-noticias
  cancel-in-progress: false

jobs:
  buscar-noticias:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install feedparser

      - name: Ejecutar buscador
        run: python scripts/buscar_noticias.py

      - name: Guardar noticias encontradas
        uses: actions/upload-artifact@v4
        with:
          name: noticias-pendientes
          path: datos/noticias_pendientes.json
          retention-days: 30
          if-no-files-found: error

      - name: Actualizar historial en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/noticias_pendientes.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Actualizar noticias pendientes automaticamente"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
