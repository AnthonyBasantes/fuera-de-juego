
name: Crear borrador de noticia

on:
  workflow_dispatch:
    inputs:
      noticia_id:
        description: 'ID de la noticia pendiente'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: crear-borradores
  cancel-in-progress: false

jobs:
  crear-borrador:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Crear borrador
        env:
          NOTICIA_ID: ${{ inputs.noticia_id }}
        run: python scripts/crear_borrador.py

      - name: Guardar borrador en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/borradores/

          if git diff --cached --quiet; then
            echo "No hay borradores nuevos."
          else
            git commit -m "Crear nuevo borrador editorial"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
