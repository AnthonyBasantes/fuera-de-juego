name: Aprobar noticia

on:
  workflow_dispatch:
    inputs:
      noticia_id:
        description: 'ID del borrador (sin .json), por ejemplo: liga-idv-previa'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publicar-noticias
  cancel-in-progress: false

jobs:
  aprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aprobar borrador
        env:
          NOTICIA_ID: ${{ inputs.noticia_id }}
        run: python scripts/aprobar_noticia.py
      - name: Guardar publicación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/publicadas.json
          git diff --cached --quiet && exit 0
          git commit -m "Publicar noticia aprobada: ${{ inputs.noticia_id }}"
          git push
